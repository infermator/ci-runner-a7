name: quality
# Tests one commit of the source repository on GitHub-hosted runners and reports the result as commit statuses there.
# The job definitions live in the source repository's own workflow files; bin/run-job.py executes their shell steps.
# Public log policy: every step that touches source output redirects it to a file; the log shows one fixed line per job.
# Full logs go to the private log repository. No pull_request triggers: forks never receive secrets.
run-name: ${{ github.event_name == 'schedule' && 'poll' || format('test {0}', inputs.sha) }}

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Commit to test (40 hex characters)
        required: true
        type: string
      suites:
        description: Space-separated groups to run (quality, sql)
        required: false
        default: quality sql
        type: string
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'

permissions: {}

concurrency:
  group: ${{ github.event_name == 'schedule' && 'poll' || format('test-{0}', inputs.sha) }}
  cancel-in-progress: false

jobs:
  poll:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
    steps:
      - name: Dispatch untested commits
        env:
          SRC_REPO: ${{ secrets.SRC_REPO }}
          SRC_TOKEN: ${{ secrets.SRC_TOKEN }}
          DISPATCH_TOKEN: ${{ github.token }}
          SELF_REPO: ${{ github.repository }}
          SELF_REF: ${{ github.ref_name }}
        run: |
          git clone -q "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$RUNNER_TEMP/runner" >/dev/null 2>&1
          git -C "$RUNNER_TEMP/runner" checkout -q "$GITHUB_SHA" >/dev/null 2>&1
          python3 "$RUNNER_TEMP/runner/bin/poll.py" || status=$?
          python3 "$RUNNER_TEMP/runner/bin/pulse.py" ensure || true
          exit "${status:-0}"

  # Every test run restarts the pulse chain (.github/workflows/pulse.yml) if it is not running, so one manual dispatch revives the poller.
  keepalive:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Keep the poller running
        env:
          DISPATCH_TOKEN: ${{ github.token }}
          SELF_REPO: ${{ github.repository }}
          SELF_REF: ${{ github.ref_name }}
        run: |
          git clone -q "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$RUNNER_TEMP/runner" >/dev/null 2>&1
          git -C "$RUNNER_TEMP/runner" checkout -q "$GITHUB_SHA" >/dev/null 2>&1
          python3 "$RUNNER_TEMP/runner/bin/pulse.py" ensure || true

  setup:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.v.outputs.sha }}
      app: ${{ steps.v.outputs.app }}
      db: ${{ steps.v.outputs.db }}
      date: ${{ steps.v.outputs.date }}
    steps:
      - name: Validate inputs
        id: v
        env:
          SHA_IN: ${{ inputs.sha }}
          SUITES_IN: ${{ inputs.suites }}
        run: |
          set -f
          [[ $SHA_IN =~ ^[0-9a-f]{40}$ ]] || { echo "invalid commit id"; exit 1; }
          app=false db=false
          for s in $SUITES_IN; do
            case "$s" in
              quality) app=true ;;
              sql) db=true ;;
              *) echo "unknown suite group"; exit 1 ;;
            esac
          done
          [ "$app$db" != falsefalse ] || { echo "no suite group"; exit 1; }
          { echo "sha=$SHA_IN"; echo "app=$app"; echo "db=$db"; echo "date=$(date -u +%F)"; } >>"$GITHUB_OUTPUT"
      - name: Mark pending
        env:
          SRC_REPO: ${{ secrets.SRC_REPO }}
          SRC_TOKEN: ${{ secrets.SRC_TOKEN }}
          SHA: ${{ steps.v.outputs.sha }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git clone -q "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$RUNNER_TEMP/runner" >/dev/null 2>&1
          git -C "$RUNNER_TEMP/runner" checkout -q "$GITHUB_SHA" >/dev/null 2>&1
          python3 "$RUNNER_TEMP/runner/bin/status.py" pending ci/quality running

  app:
    needs: setup
    if: needs.setup.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: node, workflow: quality.yml, job: node }
          - { label: python, workflow: quality.yml, job: python }
    env:
      SHA: ${{ needs.setup.outputs.sha }}
      LABEL: ${{ matrix.label }}
      TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Prepare
        env:
          SRC_REPO: ${{ secrets.SRC_REPO }}
          SRC_TOKEN: ${{ secrets.SRC_TOKEN }}
        run: |
          git clone -q "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$RUNNER_TEMP/runner" >/dev/null 2>&1
          git -C "$RUNNER_TEMP/runner" checkout -q "$GITHUB_SHA" >/dev/null 2>&1
          python3 "$RUNNER_TEMP/runner/bin/status.py" pending "ci/quality/$LABEL" running || true
          bash "$RUNNER_TEMP/runner/bin/fetch-source.sh" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/job.log"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Run
        env:
          WF: ${{ matrix.workflow }}
          JOB: ${{ matrix.job }}
        run: |
          python -m venv "$RUNNER_TEMP/rt" >/dev/null 2>&1 &&
            "$RUNNER_TEMP/rt/bin/pip" install -q --require-hashes -r "$RUNNER_TEMP/runner/bin/requirements.txt" >/dev/null 2>&1 ||
            { echo "runner setup failed"; exit 1; }
          "$RUNNER_TEMP/rt/bin/python" "$RUNNER_TEMP/runner/bin/run-job.py" --workflow "$WF" --job "$JOB" --label "$LABEL" \
            --src "$GITHUB_WORKSPACE" --log "$RUNNER_TEMP/job.log" --result "$RUNNER_TEMP/result.json" --sha "$SHA" --node 24 --python 3.12
      - name: Report
        if: always()
        env:
          SRC_REPO: ${{ secrets.SRC_REPO }}
          SRC_TOKEN: ${{ secrets.SRC_TOKEN }}
          LOG_REPO: ${{ secrets.LOG_REPO }}
          LOG_TOKEN: ${{ secrets.LOG_TOKEN || secrets.SRC_TOKEN }}
          RUN_DATE: ${{ needs.setup.outputs.date }}
        run: bash "$RUNNER_TEMP/runner/bin/report-job.sh"

  db:
    needs: setup
    if: needs.setup.outputs.db == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: sql-ingest, workflow: quality-sql.yml, job: sql-ingest }
          - { label: sql, workflow: quality-sql.yml, job: sql }
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['55432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SHA: ${{ needs.setup.outputs.sha }}
      LABEL: ${{ matrix.label }}
      TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Prepare
        env:
          SRC_REPO: ${{ secrets.SRC_REPO }}
          SRC_TOKEN: ${{ secrets.SRC_TOKEN }}
        run: |
          git clone -q "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$RUNNER_TEMP/runner" >/dev/null 2>&1
          git -C "$RUNNER_TEMP/runner" checkout -q "$GITHUB_SHA" >/dev/null 2>&1
          python3 "$RUNNER_TEMP/runner/bin/status.py" pending "ci/quality/$LABEL" running || true
          bash "$RUNNER_TEMP/runner/bin/fetch-source.sh" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/job.log"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Run
        env:
          WF: ${{ matrix.workflow }}
          JOB: ${{ matrix.job }}
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          python -m venv "$RUNNER_TEMP/rt" >/dev/null 2>&1 &&
            "$RUNNER_TEMP/rt/bin/pip" install -q --require-hashes -r "$RUNNER_TEMP/runner/bin/requirements.txt" >/dev/null 2>&1 ||
            { echo "runner setup failed"; exit 1; }
          "$RUNNER_TEMP/rt/bin/python" "$RUNNER_TEMP/runner/bin/run-job.py" --workflow "$WF" --job "$JOB" --label "$LABEL" \
            --src "$GITHUB_WORKSPACE" --log "$RUNNER_TEMP/job.log" --result "$RUNNER_TEMP/result.json" --sha "$SHA" --node 24 --python 3.12 \
            --pg-image postgres:17 --pg-container "$PG_CONTAINER"
      - name: Report
        if: always()
        env:
          SRC_REPO: ${{ secrets.SRC_REPO }}
          SRC_TOKEN: ${{ secrets.SRC_TOKEN }}
          LOG_REPO: ${{ secrets.LOG_REPO }}
          LOG_TOKEN: ${{ secrets.LOG_TOKEN || secrets.SRC_TOKEN }}
          RUN_DATE: ${{ needs.setup.outputs.date }}
        run: bash "$RUNNER_TEMP/runner/bin/report-job.sh"

  report:
    needs: [setup, app, db]
    if: always() && needs.setup.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Aggregate
        env:
          SRC_REPO: ${{ secrets.SRC_REPO }}
          SRC_TOKEN: ${{ secrets.SRC_TOKEN }}
          LOG_REPO: ${{ secrets.LOG_REPO }}
          LOG_TOKEN: ${{ secrets.LOG_TOKEN || secrets.SRC_TOKEN }}
          SHA: ${{ needs.setup.outputs.sha }}
          RUN_DATE: ${{ needs.setup.outputs.date }}
          WANT_APP: ${{ needs.setup.outputs.app }}
          WANT_DB: ${{ needs.setup.outputs.db }}
          APP_RESULT: ${{ needs.app.result }}
          DB_RESULT: ${{ needs.db.result }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
        run: |
          git clone -q "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$RUNNER_TEMP/runner" >/dev/null 2>&1
          git -C "$RUNNER_TEMP/runner" checkout -q "$GITHUB_SHA" >/dev/null 2>&1
          bash "$RUNNER_TEMP/runner/bin/report-run.sh"
